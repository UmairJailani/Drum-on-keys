<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05070a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Groove Pad">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TD-POV Groove Pad</title>
<meta property="og:title" content="TD-POV Groove Pad — Electronic Drum Memory Game">
<meta property="og:image" content="https://umairjailani.github.io/Drum-on-keys/preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

<div class="scene">

  <div class="stage-light stage-light-top"></div>
  <div class="stage-light stage-light-bottom"></div>

  <header class="header">
    <div class="header-eyebrow">● ELECTRONIC DRUM</div>
    <h1 class="header-title">TD-POV GROOVE PAD</h1>
  </header>

  <div class="device">

    <div class="console">
      <div class="screen">
        <div class="screen-round">
          <div class="screen-label">ROUND</div>
          <div class="screen-round-value">0</div>
        </div>
        <div class="screen-info">
          <div>BEST&nbsp;&nbsp;<span class="screen-best-value">0</span></div>
          <div class="screen-status">PRESS FOLLOW TO START</div>
        </div>
      </div>
      <div class="transport">
        <button class="play-btn" type="button">▶ FOLLOW</button>
      </div>
    </div>

    <div class="pad-grid">
      <!-- pads are generated by app.js from the same list used for key bindings and sounds -->
    </div>

  </div>

  <p class="hint">A S D F = cymbals &amp; hats&nbsp;&nbsp;·&nbsp;&nbsp;J K L ; = kick · snare · toms&nbsp;&nbsp;·&nbsp;&nbsp;SPACE = kick&nbsp;&nbsp;·&nbsp;&nbsp;▶ FOLLOW: watch the pattern, then play it back. It grows by one every round.</p>

</div>

<script src="app.js?v=2"></script>
</body>
</html>
